name: Release

# Push a tag like v0.1.0 to build binaries for every platform and attach them
# to a GitHub release. If a CARGO_REGISTRY_TOKEN secret exists, the crate is
# also published to crates.io.
on:
  push:
    tags: ["v[0-9]+.*"]

permissions:
  contents: write

# The crate lives in DiskDiet/, not at the repo root.
defaults:
  run:
    working-directory: DiskDiet

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: DiskDiet/CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

  binaries:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: diskdiet
          manifest-path: DiskDiet/Cargo.toml
          target: ${{ matrix.target }}
          archive: diskdiet-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  crates-io:
    needs: binaries
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --locked
