name: Idea for a check
description: Something CLIs often get wrong that mannerly could test
labels: [enhancement]
body:
  - type: textarea
    id: behavior
    attributes:
      label: What should a well-behaved CLI do?
      description: Link a guideline if there is one (clig.dev, no-color.org, POSIX).
    validations:
      required: true
  - type: textarea
    id: test
    attributes:
      label: How could mannerly test it from the outside?
      description: What to run, and what output or exit code would mean pass or fail.
  - type: textarea
    id: examples
    attributes:
      label: Tools that get it right or wrong
