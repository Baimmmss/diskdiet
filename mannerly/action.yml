name: mannerly
description: Score a command-line tool's manners (help, errors, pipes, NO_COLOR, Ctrl-C) and fail below a minimum.
author: baim
branding:
  icon: terminal
  color: green

inputs:
  command:
    description: The command to check, for example `./target/release/mytool` or `mytool build`.
    required: true
  min-score:
    description: Fail the step if the score is below this (0-100).
    required: false
    default: "0"
  args:
    description: Extra mannerly flags, for example `--no-bare --skip robust.startup`.
    required: false
    default: ""
  version:
    description: mannerly release to install, for example `v0.1.0`. Defaults to the latest.
    required: false
    default: latest

outputs:
  score:
    description: The score, 0-100.
    value: ${{ steps.run.outputs.score }}

runs:
  using: composite
  steps:
    - name: Install mannerly
      shell: bash
      env:
        MANNERLY_INSTALL_DIR: ${{ runner.temp }}/mannerly-bin
        MANNERLY_VERSION: ${{ inputs.version }}
      run: |
        sh "$GITHUB_ACTION_PATH/install.sh"
        echo "$MANNERLY_INSTALL_DIR" >> "$GITHUB_PATH"
    - name: Run mannerly
      id: run
      shell: bash
      env:
        MANNERLY_COMMAND: ${{ inputs.command }}
        MANNERLY_ARGS: ${{ inputs.args }}
        MANNERLY_MIN: ${{ inputs.min-score }}
      run: |
        # Word splitting is intended here: both values are lists of arguments.
        # shellcheck disable=SC2086
        mannerly --markdown $MANNERLY_ARGS -- $MANNERLY_COMMAND | tee -a "$GITHUB_STEP_SUMMARY"
        # shellcheck disable=SC2086
        score="$(mannerly --quiet $MANNERLY_ARGS -- $MANNERLY_COMMAND)"
        echo "score=$score" >> "$GITHUB_OUTPUT"
        if [ "$score" -lt "$MANNERLY_MIN" ]; then
          echo "::error::mannerly score $score is below the minimum of $MANNERLY_MIN"
          exit 1
        fi
