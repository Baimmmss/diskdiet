[package]
name = "mannerly"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Lighthouse for command-line tools: scores any CLI on help, errors, pipes, colors, speed and Ctrl-C, then tells you how to fix it."
license = "MIT"
repository = "https://github.com/Baimmmss/mannerly"
homepage = "https://github.com/Baimmmss/mannerly"
readme = "README.md"
keywords = ["cli", "lint", "ux", "testing", "terminal"]
categories = ["command-line-utilities", "development-tools::testing"]
exclude = ["assets/", ".github/", "demo.tape", "scripts/", "log.json", "PRD.md", "AGENTS.md", "CLAUDE.md"]

[dependencies]
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[profile.release]
lto = true
codegen-units = 1
strip = true
