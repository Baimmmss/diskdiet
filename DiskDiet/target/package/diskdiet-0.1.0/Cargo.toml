[package]
edition = "2024"
rust-version = "1.88"
name = "diskdiet"
version = "0.1.0"
build = false
exclude = [
    "assets/",
    ".github/",
    "demo.tape",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Find and delete the gigabytes your dev tools leave behind: node_modules, target/, .venv, Xcode DerivedData, package-manager caches and more."
homepage = "https://github.com/Baimmmss/diskdiet"
readme = "README.md"
keywords = [
    "cli",
    "disk",
    "cleanup",
    "node-modules",
    "tui",
]
categories = [
    "command-line-utilities",
    "filesystem",
    "development-tools",
]
license = "MIT"
repository = "https://github.com/Baimmmss/diskdiet"

[[bin]]
name = "diskdiet"
path = "src/main.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"

[dependencies.clap]
version = "4.6.7"
features = [
    "derive",
    "wrap_help",
]

[dependencies.ratatui]
version = "0.30.2"

[dependencies.rayon]
version = "1.12.0"

[dependencies.serde]
version = "1.0.229"
features = ["derive"]

[dependencies.serde_json]
version = "1.0.154"

[dev-dependencies.tempfile]
version = "3.27.0"

[profile.release]
